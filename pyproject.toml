[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mml-omap"
version = "0.1.0"
description = "Generate orienteering-oriented maps from Maanmittauslaitos open topographic data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "certifi>=2025.11.12",
  "laspy[lazrs]>=2.6",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pillow>=12.2",
  "shapely>=2.0",
]
license = "MIT"
authors = [
  { name = "mml-omap contributors" }
]
keywords = ["geojson", "geopackage", "maanmittauslaitos", "mml", "orienteering", "maps", "finland"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
mml-omap = "mml_omap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mml_omap"]
